<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var host = (window.location.hostname || '').toLowerCase();
          var path = window.location.pathname || '';
          var isLocal = host === 'localhost' || host === '127.0.0.1';
          var isAdminHost = host.startsWith('admin.') || host.startsWith('admin-') || host.includes('admin.walmark-retailshop.com');
          if (isAdminHost && !isLocal) {
            if (path !== '/admin.html' && !path.startsWith('/admin')) {
              window.location.replace('/admin.html' + window.location.search + window.location.hash);
            }
          }
        } catch (e) {}
      })();
    </script>
